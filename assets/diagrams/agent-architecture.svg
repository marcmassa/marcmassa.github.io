<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <text x="20" y="24" fill="#ECEAE3" font-size="15" font-weight="700">CLI-agnostic agent architecture</text>
  <text x="20" y="44" fill="#6E7887" font-size="11.5">One manifest, rendered into whichever AI CLI is actually running.</text>

  <!-- AGENTS.md top -->
  <rect x="370" y="66" width="160" height="50" rx="8" fill="#12314a" stroke="#199e70" stroke-width="2"/>
  <text x="450" y="88" fill="#ECEAE3" font-size="11.5" text-anchor="middle" font-weight="700">AGENTS.md</text>
  <text x="450" y="104" fill="#6E7887" font-size="9" text-anchor="middle">the cross-CLI entry point</text>
  <line x1="450" y1="116" x2="450" y2="180" stroke="#2a3550" stroke-width="1.5"/>

  <!-- center: agentic.json -->
  <rect x="380" y="180" width="140" height="60" rx="10" fill="#3a2a10" stroke="#c98500" stroke-width="2.5"/>
  <text x="450" y="206" fill="#ECEAE3" font-size="12.5" text-anchor="middle" font-weight="700">agentic.json</text>
  <text x="450" y="224" fill="#ADB5C4" font-size="9.5" text-anchor="middle">canonical manifest</text>

  <!-- connections to 4 concepts -->
  <line x1="380" y1="200" x2="140" y2="130" stroke="#2a3550" stroke-width="1.5"/>
  <line x1="380" y1="220" x2="140" y2="305" stroke="#2a3550" stroke-width="1.5"/>
  <line x1="520" y1="200" x2="760" y2="130" stroke="#2a3550" stroke-width="1.5"/>
  <line x1="520" y1="220" x2="760" y2="305" stroke="#2a3550" stroke-width="1.5"/>

  <!-- Subagents -->
  <rect x="40" y="90" width="200" height="70" rx="10" fill="#12314a" stroke="#199e70" stroke-width="1.5"/>
  <text x="140" y="113" fill="#ECEAE3" font-size="12" text-anchor="middle" font-weight="700">Subagents</text>
  <text x="140" y="131" fill="#ADB5C4" font-size="9.5" text-anchor="middle">harness → spec-author →</text>
  <text x="140" y="145" fill="#ADB5C4" font-size="9.5" text-anchor="middle">implementer → reviewer</text>

  <!-- Skills -->
  <rect x="40" y="270" width="200" height="70" rx="10" fill="#12314a" stroke="#199e70" stroke-width="1.5"/>
  <text x="140" y="293" fill="#ECEAE3" font-size="12" text-anchor="middle" font-weight="700">Skills</text>
  <text x="140" y="311" fill="#ADB5C4" font-size="9.5" text-anchor="middle">progressive disclosure —</text>
  <text x="140" y="325" fill="#ADB5C4" font-size="9.5" text-anchor="middle">loaded only when relevant</text>

  <!-- Hooks -->
  <rect x="660" y="90" width="200" height="70" rx="10" fill="#3a2a10" stroke="#c98500" stroke-width="1.5"/>
  <text x="760" y="113" fill="#ECEAE3" font-size="12" text-anchor="middle" font-weight="700">Hooks</text>
  <text x="760" y="131" fill="#ADB5C4" font-size="9.5" text-anchor="middle">on_spec_created ·</text>
  <text x="760" y="145" fill="#ADB5C4" font-size="9.5" text-anchor="middle">on_feature_done · on_check_pass</text>

  <!-- Adapters -->
  <rect x="660" y="270" width="200" height="70" rx="10" fill="#3a2a10" stroke="#c98500" stroke-width="1.5"/>
  <text x="760" y="293" fill="#ECEAE3" font-size="12" text-anchor="middle" font-weight="700">CLI adapters</text>
  <text x="760" y="311" fill="#ADB5C4" font-size="9.5" text-anchor="middle">claude-code · gemini-cli ·</text>
  <text x="760" y="325" fill="#ADB5C4" font-size="9.5" text-anchor="middle">opencode — same source of truth</text>
</svg>
