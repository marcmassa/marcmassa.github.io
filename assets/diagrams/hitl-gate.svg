<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <text x="20" y="24" fill="#ECEAE3" font-size="15" font-weight="700">Human-in-the-Loop — the one gate an agent can't skip</text>
  <text x="20" y="44" fill="#6E7887" font-size="11.5">Every round of feedback in this project went through this exact loop.</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4d5566"/>
    </marker>
  </defs>

  <!-- spec_author -->
  <rect x="30" y="80" width="160" height="60" rx="10" fill="#3a2a10" stroke="#c98500" stroke-width="2"/>
  <text x="110" y="106" fill="#ECEAE3" font-size="12.5" text-anchor="middle" font-weight="700">spec-author</text>
  <text x="110" y="124" fill="#ADB5C4" font-size="9.5" text-anchor="middle">writes 3 files, never code</text>
  <line x1="190" y1="110" x2="270" y2="110" stroke="#2a3550" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- reviewed files -->
  <rect x="280" y="70" width="180" height="80" rx="8" fill="#12314a" stroke="#199e70" stroke-width="1.5"/>
  <text x="370" y="90" fill="#ECEAE3" font-size="11.5" text-anchor="middle" font-weight="700">Reviewed together</text>
  <text x="370" y="108" fill="#ADB5C4" font-size="10" text-anchor="middle" font-family="ui-monospace,monospace">requirements.md</text>
  <text x="370" y="123" fill="#ADB5C4" font-size="10" text-anchor="middle" font-family="ui-monospace,monospace">design.md</text>
  <text x="370" y="138" fill="#ADB5C4" font-size="10" text-anchor="middle" font-family="ui-monospace,monospace">tasks.md</text>
  <line x1="460" y1="110" x2="540" y2="110" stroke="#2a3550" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- human -->
  <rect x="550" y="65" width="140" height="90" rx="12" fill="#1B2438" stroke="#E0A94A" stroke-width="2.5"/>
  <text x="620" y="98" fill="#E0A94A" font-size="13" text-anchor="middle" font-weight="700">⏸ HUMAN</text>
  <text x="620" y="118" fill="#ADB5C4" font-size="10" text-anchor="middle">covers all cases?</text>
  <text x="620" y="133" fill="#ADB5C4" font-size="10" text-anchor="middle">architecture sound?</text>
  <text x="620" y="148" fill="#ADB5C4" font-size="10" text-anchor="middle">tasks traceable?</text>

  <!-- approve path -->
  <line x1="690" y1="90" x2="800" y2="90" stroke="#199e70" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="745" y="80" fill="#6FAE8A" font-size="10.5" text-anchor="middle">approve</text>
  <rect x="800" y="65" width="80" height="50" rx="10" fill="#12314a" stroke="#199e70" stroke-width="2"/>
  <text x="840" y="95" fill="#ECEAE3" font-size="11.5" text-anchor="middle" font-weight="700">in_progress</text>

  <!-- request changes path (loop back) -->
  <path d="M620 155 L620 200 L110 200 L110 140" fill="none" stroke="#D08772" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="365" y="215" fill="#D08772" font-size="10.5" text-anchor="middle">request changes → spec-author fixes and re-submits</text>

  <text x="20" y="230" fill="#6E7887" font-size="10.5">No implementer runs before this gate says yes — even when the agent disagrees with the feedback.</text>
</svg>
