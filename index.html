<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marc Massa Capó</title>
<meta name="description" content="Marc Massa Capó — DevOps Engineer transitioning into AI Platform & Agent Systems Architecture.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header id="hero">
  <canvas id="hero-canvas"></canvas>
  <div class="wrap">
    <img class="avatar" src="assets/memoji.png" alt="Marc Massa Capó">
    <div class="copy">
      <h1 id="name"></h1>
      <div class="tagline" id="tagline"></div>
      <div class="location" id="location"></div>
      <p class="intro" id="intro"></p>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="projects">
    <h2>Projects</h2>
    <div class="project-grid" id="project-grid"></div>
  </section>

  <section id="skills">
    <h2>Stack</h2>
    <div class="skill-row" id="skill-row"></div>
  </section>
</main>

<footer>
  <div class="wrap link-row" id="link-row"></div>
</footer>

<script src="assets/content.js"></script>
<script src="assets/node-graph.js"></script>
<script>
  document.getElementById('name').textContent = SITE_DATA.name;
  document.getElementById('tagline').textContent = SITE_DATA.tagline;
  document.getElementById('location').textContent = SITE_DATA.location;
  document.getElementById('intro').textContent = SITE_DATA.intro;

  const grid = document.getElementById('project-grid');
  SITE_DATA.projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <h3>${p.name}</h3>
      <div class="role">${p.role}</div>
      <p>${p.description}</p>
      <div class="stack mono">${p.stack}</div>
      ${p.metric ? `<div class="metric">${p.metric}</div>` : ''}
      ${p.link ? `<a class="card-link" href="${p.link}" target="_blank" rel="noopener">View →</a>` : ''}
    `;
    grid.appendChild(card);
  });

  const skillRow = document.getElementById('skill-row');
  SITE_DATA.skills.forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'skill-chip';
    chip.textContent = s;
    skillRow.appendChild(chip);
  });

  const linkRow = document.getElementById('link-row');
  const linkLabels = { github: 'GitHub', kofi: 'Ko-fi', linkedin: 'LinkedIn', cv: 'CV' };
  Object.keys(linkLabels).forEach(key => {
    const url = SITE_DATA.links[key];
    const a = document.createElement('a');
    a.textContent = linkLabels[key];
    if (url) {
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
    } else {
      a.href = '#';
      a.setAttribute('data-missing', 'true');
      a.title = 'Coming soon';
    }
    linkRow.appendChild(a);
  });

  renderNodeGraph('hero-canvas', { width: window.innerWidth, height: document.getElementById('hero').offsetHeight || 400 });
</script>

</body>
</html>
